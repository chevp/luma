<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chi · Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="brand-logo">χ</span>
            <span class="brand-name">chi <small>· Console</small></span>
            <button id="toggleSidebarBtn" class="icon-btn brand-collapse" type="button" title="Collapse sidebar">
                <i class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
            </button>
        </div>

        <nav class="sidebar-scroll">
            <div class="nav-section">
                <div class="nav-label">Workspace</div>
                <button class="nav-item ws-item active" data-view="chat" type="button">
                    <i class="fa-regular fa-comment" aria-hidden="true"></i>
                    <span>Chat</span>
                </button>
            </div>

            <div class="nav-section">
                <div class="nav-label">Tools</div>
                <button class="nav-item tool-item" data-tool="status" type="button">
                    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                    <span>chi status</span>
                </button>
                <button class="nav-item tool-item" data-tool="doctor" type="button">
                    <i class="fa-solid fa-stethoscope" aria-hidden="true"></i>
                    <span>chi doctor</span>
                </button>
                <button class="nav-item tool-item" data-tool="help" type="button">
                    <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
                    <span>chi help</span>
                </button>
            </div>

            <div class="nav-section" id="chatNavSection">
                <div class="nav-label nav-label-row">
                    <span>Chats</span>
                    <button id="newChatBtn" class="nav-label-btn" type="button" title="New chat">
                        <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
                    </button>
                </div>
                <div id="chatList" class="chat-list"></div>
            </div>
        </nav>

        <div class="sidebar-bottom">
            <div class="conn-status">
                <span id="connDot" class="dot dot-idle"></span>
                <span id="connText">checking…</span>
                <span id="versionText" class="version-text"></span>
            </div>
        </div>
    </aside>

    <main class="main">
        <section class="view view-chat active" data-view="chat">
            <header class="topbar">
                <div class="topbar-left">
                    <button id="openSidebarBtn" class="icon-btn ghost-only" type="button" title="Sidebar">
                        <i class="fa-solid fa-bars" aria-hidden="true"></i>
                    </button>
                    <div class="model-picker">
                        <select id="modelSelect" aria-label="Pick a model">
                            <option value="">— loading —</option>
                        </select>
                        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                    </div>
                    <span class="topbar-eyebrow" id="providerBadge">cura</span>
                </div>
                <div class="topbar-right">
                    <button id="exportBtn" class="icon-btn" type="button" title="Export session as JSON">
                        <i class="fa-solid fa-arrow-down-to-line" aria-hidden="true"></i>
                    </button>
                    <button id="clearBtn" class="icon-btn" type="button" title="Clear history">
                        <i class="fa-regular fa-trash-can" aria-hidden="true"></i>
                    </button>
                </div>
            </header>

            <section id="feed" class="feed" aria-live="polite">
                <div class="welcome">
                    <h1>What can chi do for you?</h1>
                    <p class="welcome-sub">A chat surface over the same cura backend chi uses on the CLI.
                        Ask for a commit message, a diff summary, or run a tool from the sidebar.</p>
                    <div id="suggestionGrid" class="suggestion-grid"></div>
                </div>
            </section>

            <footer class="composer-wrap">
                <div class="composer">
                    <textarea id="userInput" class="composer-input" rows="1"
                        placeholder="Ask chi…"></textarea>
                    <div class="composer-bar">
                        <span class="composer-hint" id="composerHint">Enter to send · Shift+Enter for newline</span>
                        <div class="composer-actions">
                            <button id="abortBtn" class="circle-btn stop" type="button" disabled
                                    title="Stop generation">
                                <i class="fa-solid fa-stop" aria-hidden="true"></i>
                            </button>
                            <button id="sendBtn" class="circle-btn send" type="button" disabled
                                    title="Send (Enter)">
                                <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="composer-meta">
                    <span id="modelEcho">no model</span>
                    <span class="dot-sep">·</span>
                    <span id="latencyText">— ms</span>
                    <span class="dot-sep">·</span>
                    <span id="tokenText">— tokens</span>
                    <span class="dot-sep">·</span>
                    <span id="msgCount">0 messages</span>
                </div>
            </footer>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
