name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - name: Pack
        run: |
          npm pack
          mv luma-*.tgz luma.tgz

      - uses: softprops/action-gh-release@v2
        with:
          files: luma.tgz
          generate_release_notes: true
